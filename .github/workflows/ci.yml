name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4', '8.5']
    container: php:${{ matrix.php }}-cli
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev libzip-dev && docker-php-ext-install pdo_sqlite zip
      - run: find xiaoman-inquiry-center tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/updater.test.php
      - run: php tests/build-release.test.php
      - run: php tests/verify-release.test.php
      - run: php tests/readiness.test.php
      - run: php -n tests/lead-date.test.php
      - run: php -n tests/assets-metadata.test.php
      - run: php -n tests/form-response.test.php
      - run: php -n tests/privacy-routing.test.php
      - run: php tests/owner-protocol.test.php
      - run: php tests/schema-rolling.test.php
      - run: php tests/configuration-toggle.test.php
      - run: php tests/configuration-toggle.test.php missing-credentials
      - run: php tests/configuration-lock.test.php
      - run: php tests/runtime-pause.test.php
      - run: php tests/enhanced-two-moments.test.php
      - run: php tests/purpose-mode-assets.test.php
      - run: php tests/purpose-mode-claim.test.php
      - run: php tests/purpose-settings.test.php
      - run: php tests/purpose-upgrade-preflight.test.php
      - run: php tests/analysis-query.test.php
      - run: php tests/mcp-readonly.test.php
      - run: for site in fangwei huajing anxing rongfeng tongqu; do php tests/compatibility.test.php "$site" || exit 1; done
      - run: php tests/compatibility.test.php fangwei stored-credentials
      - run: php -d disable_functions=sodium_crypto_secretbox_open tests/compatibility.test.php fangwei missing-decrypt
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm test
      - run: node tests/purpose-helper.cjs
